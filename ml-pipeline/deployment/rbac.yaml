---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-deployment-manager
  namespace: spending-transaction-monitor
rules:
  # Read-only access to verify the Helm-managed S4 deployment.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  # Read S4 credentials and manage the KServe storage-config Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Notebook 3 creates or updates the KServe ServiceAccount that references
  # the storage-config Secret.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "update", "patch"]

  # Permissions for managing ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permissions for managing ServingRuntimes and InferenceServices
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes", "inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permissions for reading pods (to check deployment status)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-deployment-manager-binding
  namespace: spending-transaction-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-deployment-manager
subjects:
  - kind: ServiceAccount
    name: alert-recommendation
    namespace: spending-transaction-monitor
