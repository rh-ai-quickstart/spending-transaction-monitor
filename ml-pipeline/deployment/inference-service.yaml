apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: alert-recommender
  namespace: {{ namespace }}
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/storageSecretName: storage-config
    model-version: "{{ model_version }}"
    openshift.io/display-name: "Alert Recommendation Model"
  labels:
    app: alert-recommender
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    serviceAccountName: alert-recommender-sa
    model:
      modelFormat:
        name: sklearn
        version: "1"
      runtime: mlserver-sklearn
      storageUri: "s3://{{ bucket }}/{{ model_path }}"
      storage:
        key: {{ bucket }}
        parameters:
          endpoint: "{{ s3_endpoint_url }}"
          bucket: {{ bucket }}
          region: "{{ s3_region }}"
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
