# Default values for alert-recommender-pipeline

# ==============================
# Deployment Configuration
# ==============================

replicaCount: 1

# ==============================
# Service Configuration
# ==============================

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

image:
  repository: quay.io/rh-ai-quickstart/alert-recommender-pipeline
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: true

# ==============================
# Data Science Pipelines (DSPA)
# ==============================

dspa:
  deploy: true
  name: "dspa"
  database:
    deploy: true
    name: "mlpipeline"
    storage: 10Gi
    username: "mlpipeline"
    password: "mlpipeline123"
    storageClass: ""
  objectStorage:
    deploy: true
    bucket: "mlpipeline"

dsPipelines:
  url: "https://ds-pipeline-dspa:8888"
  waitForReady: false

# ==============================
# Database Configuration
# ==============================

database:
  # Wait for spending-monitor migration to complete
  waitForMigration: true
  migrationTimeout: 60

# S4-backed S3 storage for model artifacts and DSPA.
aws-compatible-storage:
  enabled: true
  fullnameOverride: s4
  # Parent-chart client and bootstrap settings are grouped with the dependency.
  client:
    # Empty values inherit the service name, ports, region, and Secret below.
    endpoint: ""
    uiEndpoint: ""
    region: ""
    bucketName: "models"
    credentialsSecret: ""
  # The parent Job creates buckets even when reusing a standalone S4 release.
  bucketBootstrap:
    create: true
  image:
    repository: quay.io/rh-aiservices-bu/s4
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  s3:
    accessKeyId: s4admin # Demo value; override for shared or production clusters.
    secretAccessKey: s4secret # Demo value; override for shared or production clusters.
    region: us-east-1
  auth:
    enabled: true
    username: admin
    password: changeme # Demo value; override for shared or production clusters.
  route:
    enabled: true # S4 Web UI only
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi

jobImages:
  python: registry.redhat.io/ubi9/python-311:latest

# ==============================
# Model Registry Configuration
# ==============================

modelRegistry:
  enabled: true
  namespace: "rhoai-model-registries"
  url: "https://model-registry.rhoai-model-registries.svc.cluster.local:8443"
  caBundle: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"

# model-registry subchart values
model-registry:
  enabled: true
  namespace: rhoai-model-registries
  name: model-registry
  postgres:
    enabled: true
    namespace: spending-transaction-monitor
    name: pgvector-model-registry
    user: postgres
    password: model_registry_password
    database: model_registry
    port: 5432
  pgvector:
    namespace: spending-transaction-monitor
    nameOverride: "pgvector-model-registry"
    fullnameOverride: "pgvector-model-registry"
    secret:
      create: true
      user: postgres
      password: model_registry_password
      dbname: model_registry
      host: pgvector-model-registry.spending-transaction-monitor.svc.cluster.local
      port: "5432"

# ==============================
# KServe / Model Serving
# ==============================

serving:
  runtime:
    create: true
    createViaPipeline: false
  inferenceService:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# ==============================
# Sample Data Configuration
# ==============================
# Note: Sample data generation removed - pipeline now depends on database

sampleData:
  generate: false

# ==============================
# Pipeline Configuration
# ==============================

# Used by upload-data-job
pipeline:
  dataVersion: "1"

pipelines:
  alert_recommender:
    enabled: true
    name: "alert-recommender"
    version: "1.0.0"
    dataVersion: "1"
    nNeighbors: 5
    metric: "cosine"
    threshold: 0.4
    deployModel: true
    registerModel: true
    deployFromRegistry: false
    modelVersionToDeploy: ""

# ==============================
# RBAC Configuration
# ==============================

rbac:
  create: true
