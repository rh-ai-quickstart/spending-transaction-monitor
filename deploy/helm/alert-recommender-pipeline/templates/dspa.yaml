{{/*
DataSciencePipelinesApplication - Required for Kubeflow Pipelines on OpenShift AI
Updated for RHOAI 3.x (v1 API)
*/}}
{{- if .Values.dspa.deploy }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dspa.name }}-db-secret
  labels:
    {{- include "alert-recommender-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.dspa.database.username | quote }}
  password: {{ .Values.dspa.database.password | quote }}
---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: {{ .Values.dspa.name }}
  labels:
    {{- include "alert-recommender-pipeline.labels" . | nindent 4 }}
spec:
  dspVersion: v2
  {{- if .Values.dspa.database.deploy }}
  database:
    mariaDB:
      deploy: true
      pipelineDBName: {{ .Values.dspa.database.name | default "mlpipeline" | quote }}
      passwordSecret:
        name: {{ .Values.dspa.name }}-db-secret
        key: password
      username: {{ .Values.dspa.database.username }}
      pvcSize: {{ .Values.dspa.database.storage }}
      {{- if .Values.dspa.database.storageClass }}
      storageClassName: {{ .Values.dspa.database.storageClass }}
      {{- end }}
  {{- end }}
  {{- if .Values.dspa.objectStorage.deploy }}
  objectStorage:
    externalStorage:
      host: {{ include "s4.fqdn" . }}
      port: {{ include "s4.apiPort" . | quote }}
      scheme: {{ include "s4.endpointScheme" . }}
      bucket: {{ .Values.dspa.objectStorage.bucket }}
      s3CredentialsSecret:
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
        secretName: {{ include "s4.secretName" . }}
  {{- end }}
{{- end }}
